[workspace]
resolver = "2"
members = ["crates/trailcarrier-core", "crates/trailcarrier-render", "crates/trailcarrier-kindle", "crates/trailcarrier-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
trailcarrier-core = { path = "crates/trailcarrier-core" }
trailcarrier-render = { path = "crates/trailcarrier-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
